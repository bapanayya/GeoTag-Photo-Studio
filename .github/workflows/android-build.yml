name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Accept Android SDK Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true
          node scripts/build-bundle.js
          npm run sync:android

      - name: Build Android APK and App Bundle (AAB for Google Play Store)
        run: |
          set -eo pipefail
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            ./gradlew bundleRelease --stacktrace
          else
            gradle assembleDebug --stacktrace
            gradle bundleRelease --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoTagStudio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoTagStudio-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Prepare Named Release Assets
        run: |
          set -eo pipefail
          echo "### Build Artifacts Discovery" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find android/app/build -name "*.apk" -o -name "*.aab" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          APK_PATH=$(find android/app/build/outputs/apk -name "*debug.apk" -o -name "*release*.apk" | head -n 1)
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          echo "Selected APK: $APK_PATH" >> $GITHUB_STEP_SUMMARY
          echo "Selected AAB: $AAB_PATH" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" GeoTagStudio.apk
            echo "Copied APK to GeoTagStudio.apk ($(ls -lh GeoTagStudio.apk | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: APK not found" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            echo "Signing Release AAB with production upload keystore..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/upload-keystore.jks -storepass geotag123 -keypass geotag123 "$AAB_PATH" geotag
            jarsigner -verify "$AAB_PATH"
            cp "$AAB_PATH" GeoTagStudio.aab
            echo "Copied signed AAB to GeoTagStudio.aab ($(ls -lh GeoTagStudio.aab | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
          else
            echo "ERROR: AAB not found in android/app/build/outputs/bundle/release" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Create or Update GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.6
          name: "GeoTag Studio Android App v1.0.6 (Official Release)"
          fail_on_unmatched_files: true
          body: |
            ### 📱 GeoTag Studio Official Android Application (v1.0.6)
            - **Official Geo Tag Camera Launcher Icon**: Configured with dedicated map background, camera lens, and red location pin across all Android launcher densities.
            - **Stamp Scale Overflow Safeguard**: Proportional card expansion and auto-scaled / wrapped coordinates, date/time, and notes preventing right-edge overflow at >100% stamp scale.
            - **Canvas Zoom & Pan**: Interactive floating zoom controls (`🔍+`, `🔍−`, `Fit`, zoom percentage, double-click, mouse wheel, and pinch-to-zoom).
            - **Native Android Bridge**: Modern MediaStore downloads directly into phone gallery/storage.
            - **Native Share Sheet**: System sharing sheet for WhatsApp, Telegram, Gmail, Drive, etc.
            - **Native Camera Capture**: Direct integration with hardware camera with instant canvas placement.
            - **Hardware GPS Geolocation**: High-accuracy satellite GPS coordinates via Android LocationManager.
            - **Custom GPS Map Camera & EXIF Stamping**: Privacy-first, 100% on-device photo geotagging.
            - **Interactive Mini-Map & Binary EXIF**: Embeds satellite/street mini-map and real EXIF GPS metadata.
            - **Direct Download**:
              - Tap `GeoTagStudio.apk` to install directly on your Android phone.
              - `GeoTagStudio.aab` is the official Google Play Store Android App Bundle (signed with production upload keystore).
          files: |
            GeoTagStudio.apk
            GeoTagStudio.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
