name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Accept Android SDK Licenses and Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor Android
        run: |
          npx cap sync android || true
          npm run sync:android

      - name: Build Android APK and App Bundle (AAB for Google Play Store)
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
            ./gradlew bundleRelease --stacktrace || true
          else
            gradle assembleDebug --stacktrace
            gradle bundleRelease --stacktrace || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoTagStudio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoTagStudio-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Prepare Named Release Assets
        run: |
          find android/app/build -name "*.apk" -o -name "*.aab" || true
          cp android/app/build/outputs/apk/debug/app-debug.apk GeoTagStudio.apk || true
          if ls android/app/build/outputs/bundle/release/*.aab 1> /dev/null 2>&1; then
            cp android/app/build/outputs/bundle/release/*.aab GeoTagStudio.aab || true
          fi

      - name: Create or Update GitHub Release with APK and AAB
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
          name: "GeoTag Studio Android App v1.0.1 (Official Release)"
          fail_on_unmatched_files: false
          body: |
            ### 📱 GeoTag Studio Official Android Application
            - **Custom GPS Map Camera & EXIF Stamping**: Privacy-first, 100% on-device photo geotagging
            - **Photo-Friendly Compact Layout**: Bottom-left compact stamp ensures photo subjects remain unblocked
            - **Interactive Mini-Map & Binary EXIF**: Embeds satellite/street mini-map and real EXIF GPS metadata
            - **Preloaded Presets & Typo-Tolerant Search**: SVA Govt College, regional landmarks, and offline search
            - **The Competitive Edge Official Logo**: Powered by The Competitive Edge
            - **Direct Download**:
              - Tap `GeoTagStudio.apk` to install directly on your Android phone.
              - `GeoTagStudio.aab` is the official Google Play Store Android App Bundle.
          files: |
            GeoTagStudio.apk
            GeoTagStudio.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
